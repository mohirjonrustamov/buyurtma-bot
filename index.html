<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>New order</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="page">

  <div class="header">
    <h1>New order</h1>
    <p class="subtitle">Enter payment information</p>
  </div>

  <form id="orderForm">

    <div class="field">
      <label for="order_num">Order #</label>
      <input type="text" id="order_num" inputmode="numeric" maxlength="5" placeholder="e.g. 10024" required />
      <span class="error" id="err_order_num"></span>
    </div>

    <div class="section">
      <div class="section-title">Payment 1</div>

      <div class="field">
        <label>Payment to</label>
        <div class="chip-group" id="payto1_group" data-target="pay1_payment_to">
          <button type="button" class="chip" data-value="SK">SK</button>
          <button type="button" class="chip" data-value="CS">CS</button>
          <button type="button" class="chip" data-value="AD">AD</button>
          <button type="button" class="chip" data-value="ART">ART</button>
          <button type="button" class="chip" data-value="PKT">PKT</button>
          <button type="button" class="chip" data-value="Agent">Agent</button>
          <button type="button" class="chip" data-value="Cash">Cash</button>
          <button type="button" class="chip" data-value="Free">Free</button>
        </div>
        <input type="hidden" id="pay1_payment_to" />
        <span class="error" id="err_pay1_payment_to"></span>
      </div>

      <div class="field">
        <label for="pay1_amount">Amount</label>
        <input type="number" id="pay1_amount" inputmode="numeric" min="0" step="1" maxlength="10" placeholder="0" required />
        <span class="error" id="err_pay1_amount"></span>
      </div>

      <div class="field">
        <label>Currency</label>
        <div class="chip-group" id="currency1_group" data-target="pay1_currency">
          <button type="button" class="chip" data-value="$">$</button>
          <button type="button" class="chip" data-value="€">€</button>
          <button type="button" class="chip" data-value="UZS">UZS</button>
          <button type="button" class="chip" data-value="RUB">RUB</button>
        </div>
        <input type="hidden" id="pay1_currency" />
        <span class="error" id="err_pay1_currency"></span>
      </div>
    </div>

    <button type="button" class="add-payment-btn" id="togglePay2">
      + Add another payment
    </button>

    <div class="section" id="pay2Section" style="display:none;">
      <div class="section-title">
        Payment 2
        <button type="button" class="remove-btn" id="removePay2">✕ remove</button>
      </div>

      <div class="field">
        <label>Payment to</label>
        <div class="chip-group" id="payto2_group" data-target="pay2_payment_to">
          <button type="button" class="chip" data-value="SK">SK</button>
          <button type="button" class="chip" data-value="CS">CS</button>
          <button type="button" class="chip" data-value="AD">AD</button>
          <button type="button" class="chip" data-value="ART">ART</button>
          <button type="button" class="chip" data-value="PKT">PKT</button>
          <button type="button" class="chip" data-value="Agent">Agent</button>
          <button type="button" class="chip" data-value="Cash">Cash</button>
          <button type="button" class="chip" data-value="Free">Free</button>
        </div>
        <input type="hidden" id="pay2_payment_to" />
      </div>

      <div class="field">
        <label for="pay2_amount">Amount</label>
        <input type="number" id="pay2_amount" inputmode="numeric" min="0" step="1" maxlength="10" placeholder="0" />
      </div>

      <div class="field">
        <label>Currency</label>
        <div class="chip-group" id="currency2_group" data-target="pay2_currency">
          <button type="button" class="chip" data-value="$">$</button>
          <button type="button" class="chip" data-value="€">€</button>
          <button type="button" class="chip" data-value="UZS">UZS</button>
          <button type="button" class="chip" data-value="RUB">RUB</button>
        </div>
        <input type="hidden" id="pay2_currency" />
      </div>
    </div>

    <div class="field">
      <label for="due_date">Payment date</label>
      <input type="date" id="due_date" required />
      <span class="error" id="err_due_date"></span>
    </div>

    <div class="field">
      <label for="contact_details">Contact details</label>
      <input type="text" id="contact_details" placeholder="Phone+Name" required />
      <span class="error" id="err_contact_details"></span>
    </div>

  </form>

  <div class="banner" id="banner"></div>

</div>

<script src="script.js"></script>
</body>
</html>
